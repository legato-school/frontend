name: DAST CI

on:
  push:
    branches: [main]

jobs:
  dast:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Run DAST Security Scan
        uses: LogixDevCo/dast-scan@2a81f6a445a4e53a98957086b88a90ceb34037c9
        with:
          target-url: "https://legatoschool.com"
